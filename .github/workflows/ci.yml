name: Backend CI
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: academic_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d academic_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://planner:planner@localhost:5432/academic_planner_test
      ACCESS_SECRET_KEY: ci-access-secret-at-least-32-characters
      REFRESH_SECRET_KEY: ci-refresh-secret-at-least-32-characters
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
